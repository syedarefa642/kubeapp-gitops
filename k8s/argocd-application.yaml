apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/syedarefa642/kubeapp-gitops.git

    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true      # removes resources deleted from git
      selfHeal: true   # reverts any manual kubectl changes
    syncOptions:
      - CreateNamespace=true

