name: Build and Push Frontend Image

on:
  push:
    branches: [main]
    paths: [frontend/**]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            refa642/kubeapp-frontend:latest
            refa642/kubeapp-frontend:${{ github.sha }}

      - name: Update image tag in manifest
        run: |
          sed -i 's|refa642/kubeapp-frontend:.*|refa642/kubeapp-frontend:${{ github.sha }}|' k8s/frontend-deployment.yaml

      - name: Commit updated manifest
        run: |
          git config user.name github-actions[bot]
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/frontend-deployment.yaml
          git commit -m "ci: update image tag to ${{ github.sha }}" || echo "No changes to commit"
          git push
